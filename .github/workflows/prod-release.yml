name: Production release

# Runs after every merge into prod. It raises the package version according to
# the merged pull request's release:* label, rebuilds every platform from that
# commit, and publishes a GitHub Release only if all three builds pass.

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to raise
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: prod-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Raise version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
      previous-tag: ${{ steps.bump.outputs.previous-tag }}
    steps:
      - name: Check out prod
        uses: actions/checkout@v6
        with:
          ref: prod
          fetch-depth: 0

      - name: Read the bump level from the merged pull request
        id: level
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_LEVEL: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_LEVEL}" ]; then
            level="${DISPATCH_LEVEL}"
            reason="the workflow_dispatch input"
          else
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].labels[].name' || true)"
            if grep -Fxq 'release:major' <<<"${labels}"; then
              level="major"
              reason="the release:major pull request label"
            elif grep -Fxq 'release:minor' <<<"${labels}"; then
              level="minor"
              reason="the release:minor pull request label"
            elif grep -Fxq 'release:patch' <<<"${labels}"; then
              level="patch"
              reason="the release:patch pull request label"
            else
              level="patch"
              reason="the default, because the commit carried no release:* label"
            fi
          fi
          echo "level=${level}" >> "${GITHUB_OUTPUT}"
          echo "Raising the ${level} version from ${reason}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Bump the version and commit it to prod
        id: bump
        env:
          LEVEL: ${{ steps.level.outputs.level }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          version="$(./scripts/bump-version.sh "${LEVEL}")"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists. Raise the version in Cargo.toml by hand and push again." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v${version}"
          git push origin HEAD:prod
          {
            echo "version=${version}"
            echo "sha=$(git rev-parse HEAD)"
            echo "previous-tag=${previous_tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "Building Textify v${version}." >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build-platforms.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - version
      - build
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ./*.zip ./*.tar.gz ./*.deb ./*.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous-tag }}
        run: |
          set -euo pipefail
          {
            echo "Native builds of Textify ${VERSION}. No runtime or toolchain is needed to run them."
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| macOS 12+ (Apple Silicon and Intel) | \`textify-${VERSION}-macos-universal.zip\` |"
            echo "| Windows 10/11 x64 | \`textify-${VERSION}-windows-x64-setup.exe\` (installer) or \`textify-${VERSION}-windows-x64.zip\` (portable) |"
            echo "| Linux x64 (glibc 2.35+) | \`textify-${VERSION}-linux-amd64.deb\` or \`textify-${VERSION}-linux-x64.tar.gz\` |"
            echo
            echo "These files are **not code-signed**. macOS Gatekeeper and Windows SmartScreen warn on first launch."
            echo "On macOS, remove the download quarantine after moving the app to /Applications:"
            echo
            echo '```sh'
            echo "xattr -dr com.apple.quarantine /Applications/Textify.app"
            echo '```'
            echo
            echo "Verify a download with \`shasum -a 256 -c SHA256SUMS\`."
            if [ -n "${PREVIOUS_TAG}" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...v${VERSION}"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" dist/* \
            --target "${RELEASE_SHA}" \
            --title "Textify v${VERSION}" \
            --notes-file release-notes.md \
            --latest
