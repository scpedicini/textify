[package]
name = "textify"
version = "0.1.1"
edition = "2024"
rust-version = "1.93.1"
default-run = "textify"
description = "A native text editor for macOS, Linux, and Windows"
license = "MIT"
repository = "https://github.com/scpedicini/textify"
readme = "README.md"
keywords = ["editor", "text-editor", "gpui"]
categories = ["text-editors"]

[workspace]
members = [".", "vendor/gpui-component"]
resolver = "2"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { path = "vendor/gpui-component", version = "=0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.5.1"
libc = "=0.2.189"
notify = "=7.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "=2.5.8"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }

[build-dependencies]
embed-resource = "=3.0.11"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"

[profile.dev]
debug = "limited"

[profile.dev.package]
gpui = { opt-level = 3 }
ropey = { opt-level = 3 }
taffy = { opt-level = 3 }
tree-sitter = { opt-level = 3 }

[profile.release]
codegen-units = 1
lto = "thin"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
